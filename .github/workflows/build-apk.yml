name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - v*
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    # `hadoku-builder`, not `hadoku-builder-heavy` — no runner in the pool carries
    # the -heavy label, so every build since the self-hosted migration queued until
    # GitHub cancelled it at the 24h cap.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","hadoku-builder"]') }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # No `version:` input — action-setup reads pnpm from package.json's
    # `packageManager` field (single source of truth; specifying both errors).
    - name: Set up pnpm
      uses: pnpm/action-setup@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: temurin

    # android-actions/setup-android shells out to `unzip` to unpack cmdline-tools,
    # and the hadoku-builder image doesn't ship it. Install on demand rather than
    # depending on a fatter runner image.
    - name: Ensure unzip is present
      run: command -v unzip || (sudo apt-get update && sudo apt-get install -y unzip)

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Sync Capacitor
      run: pnpm exec cap sync android

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Rename APK
      run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/hadoku-task.apk || cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/hadoku-task.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: hadoku-task-apk
        path: android/app/build/outputs/apk/release/hadoku-task.apk
        retention-days: 30

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: android/app/build/outputs/apk/release/hadoku-task.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
